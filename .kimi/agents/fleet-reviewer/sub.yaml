version: 1
agent:
  extend: default
  name: fleet-kimi-subreviewer
  system_prompt_args:
    ROLE_ADDITIONAL: |
      You are a read-only fleet subreviewer. Stay strictly inside the configured
      working directory and return exact repository evidence to the main agent.
      Never modify files, execute shell commands, access external directories,
      or perform Git mutations.
  tools:
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:ReadMediaFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
  subagents:
