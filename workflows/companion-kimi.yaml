{
  "schema_version": 1,
  "name": "companion-kimi",
  "description": "Mission-bound companion roster with Codex, Claude Opus, local Gemma, and Kimi K3",
  "preset": "companion_kimi",
  "autonomy": {
    "owner": "lead",
    "allow_parallel": true,
    "allow_subdelegation": false,
    "max_delegation_depth": 0
  },
  "capabilities": {
    "available": [
      "recon",
      "build",
      "verify",
      "general_analysis",
      "architecture",
      "independent_code_review"
    ],
    "required_outcomes": ["lead_result"],
    "writer": "build"
  },
  "risk": {
    "minimum": "low",
    "allow_lead_escalation": false,
    "high_action": "fail"
  },
  "assurance": {
    "profile": "none",
    "preset": "fleet_dialogue",
    "minimum_gates": []
  },
  "audit": {
    "mode": "signed",
    "trust_scope": "local-development",
    "worm_required_for": ["regulated"]
  },
  "archive": {
    "mode": "incremental",
    "content_policy": "full",
    "include_final_tree": true,
    "include_git_delta": true
  },
  "limits": {
    "deadline_seconds": 3600,
    "token_budget": 0,
    "budget_mode": "soft",
    "delegation_credits": 8,
    "max_active_delegations": 3
  }
}
