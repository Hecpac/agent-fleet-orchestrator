{
  "schema_version": 3,
  "defaults": {
    "preset": "small",
    "race_roles": ["codex_candidate", "minimax_candidate"]
  },
  "providers": {
    "claude": {
      "submit": {"repress_safe": true, "confirm_timeout_seconds": 6, "event_source": "cmux"}
    },
    "codex": {
      "submit": {"repress_safe": true, "confirm_timeout_seconds": 6, "event_source": "cmux"}
    },
    "kimi": {
      "submit": {"repress_safe": false, "confirm_timeout_seconds": 30, "event_source": "wire-bridge"}
    },
    "opencode": {
      "submit": {"repress_safe": true, "confirm_timeout_seconds": 6, "event_source": "cmux"}
    }
  },
  "limits": {
    "max_local_heavy_in_flight": 1,
    "max_parallel_local_workers": 3,
    "local_token_budget_per_feature": 200000,
    "avoid_local_models": [
      "gemma4:26b",
      "qwen3-coder:30b",
      "devstral:24b"
    ]
  },
  "lead": {
    "instance_id": "lead",
    "phase": "CONTROL",
    "display_rank": 10,
    "candidates": ["codex", "claude"],
    "fallback_policy": "first_available",
    "authority": "control",
    "tool_access": ["filesystem", "shell", "git", "cmux"],
    "capabilities": [
      "planning",
      "architecture",
      "routing",
      "final_decision",
      "conflict_resolution",
      "high_risk_code_changes"
    ]
  },
  "roles": {
    "triage": {
      "phase": "RECON",
      "runner": "local",
      "provider": "ollama",
      "model": "gemma3:4b",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["summarize", "classify", "extract", "compare_outputs"],
      "tool_access": ["prompt_only"],
      "authority": "advisory",
      "resource_class": "local_light",
      "display_rank": 20,
      "concurrency": 2,
      "instructions": "You classify, summarize, extract, and compare supplied evidence. Be concise."
    },
    "light_code": {
      "phase": "RECON",
      "runner": "local",
      "provider": "ollama",
      "model": "granite-code:3b",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["supplied_grep_analysis", "small_fix_suggestions", "documentation_suggestions"],
      "tool_access": ["prompt_only"],
      "authority": "advisory",
      "resource_class": "local_light",
      "display_rank": 21,
      "concurrency": 2,
      "instructions": "You analyze supplied code and command output. Prefer concrete symbols and do not claim filesystem access."
    },
    "general_worker": {
      "phase": "RECON",
      "runner": "local",
      "provider": "ollama",
      "model": "gemma4:latest",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["general_analysis", "synthesis", "uncertainty_preservation"],
      "tool_access": ["prompt_only"],
      "authority": "advisory",
      "resource_class": "local_heavy",
      "display_rank": 25,
      "concurrency": 1,
      "instructions": "You solve general analysis tasks from supplied evidence and preserve uncertainty."
    },
    "codex": {
      "phase": "BUILD",
      "runner": "interactive",
      "provider": "openai",
      "model": "gpt-5.6-sol",
      "hook_source": "codex",
      "transport": "pointer",
      "command": ["codex", "--model", "gpt-5.6-sol"],
      "healthcheck": ["codex", "login", "status"],
      "ready_pattern": "^[[:space:]]*›[[:space:]].+",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["implementation", "deep_diagnosis", "code_review", "second_opinion"],
      "tool_access": ["filesystem", "shell", "git", "fleet_control"],
      "authority": "write",
      "resource_class": "remote",
      "display_rank": 30,
      "concurrency": 2
    },
    "codex_candidate": {
      "phase": "BUILD",
      "runner": "interactive",
      "provider": "openai",
      "model": "gpt-5.6-sol",
      "hook_source": "codex",
      "transport": "pointer",
      "command": ["codex", "--model", "gpt-5.6-sol"],
      "healthcheck": ["codex", "login", "status"],
      "ready_pattern": "^[[:space:]]*›[[:space:]].+",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["candidate_generation", "deep_diagnosis", "second_opinion"],
      "tool_access": ["filesystem_read", "shell_read", "git_read", "fleet_control"],
      "authority": "advisory",
      "resource_class": "remote",
      "display_rank": 30,
      "concurrency": 2
    },
    "claude": {
      "phase": "BUILD",
      "runner": "interactive",
      "provider": "anthropic",
      "model": "claude-fable-5",
      "hook_source": "claude",
      "transport": "pointer",
      "command": ["claude", "--model", "claude-fable-5", "--no-chrome"],
      "healthcheck": ["claude", "auth", "status"],
      "ready_pattern": "^[[:space:]]*❯[[:space:]]*$|new task\\?",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["planning", "architecture", "implementation", "deep_diagnosis"],
      "tool_access": ["filesystem", "shell", "git", "fleet_control"],
      "authority": "write",
      "resource_class": "remote",
      "display_rank": 31,
      "concurrency": 1
    },
    "code_worker": {
      "phase": "BUILD",
      "runner": "local",
      "provider": "ollama",
      "model": "qwen2.5-coder:7b",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["supplied_code_analysis", "patch_suggestions", "bug_hypotheses"],
      "tool_access": ["prompt_only"],
      "authority": "advisory",
      "resource_class": "local_heavy",
      "display_rank": 32,
      "concurrency": 1,
      "instructions": "You analyze supplied code and propose small focused changes. Do not claim to have edited files."
    },
    "glm": {
      "phase": "CHALLENGE",
      "runner": "interactive",
      "provider": "zai",
      "model": "glm-5.2",
      "hook_source": "opencode",
      "transport": "inline-json",
      "command": ["opencode", "-m", "zai/glm-5.2", "--agent", "glm-challenger"],
      "healthcheck": ["opencode", "--version"],
      "ready_pattern": "ctrl\\+p commands|\\.opencode/agents/|[0-9]+\\.[0-9]+\\.[0-9]+[[:space:]]*$",
      "enabled": true,
      "requires_env": ["ZHIPU_API_KEY"],
      "capabilities": ["diverse_perspective", "parallel_validation", "architecture_challenge"],
      "tool_access": ["filesystem_read", "fleet_control"],
      "authority": "advisory",
      "resource_class": "remote",
      "display_rank": 40,
      "concurrency": 1
    },
    "minimax": {
      "phase": "CHALLENGE",
      "runner": "interactive",
      "provider": "minimax",
      "model": "MiniMax-M3",
      "variant": "none",
      "hook_source": "opencode",
      "transport": "inline-json",
      "command": ["opencode", "--agent", "fleet-reviewer"],
      "healthcheck": ["opencode", "--version"],
      "ready_pattern": "ctrl\\+p commands|\\.opencode/agents/|[0-9]+\\.[0-9]+\\.[0-9]+[[:space:]]*$",
      "enabled": true,
      "requires_env": ["MINIMAX_API_KEY"],
      "capabilities": ["diverse_perspective", "parallel_validation", "architecture_challenge"],
      "tool_access": ["filesystem_read", "fleet_control"],
      "authority": "advisory",
      "resource_class": "remote",
      "display_rank": 40,
      "concurrency": 1
    },
    "minimax_candidate": {
      "phase": "BUILD",
      "runner": "interactive",
      "provider": "minimax",
      "model": "MiniMax-M3",
      "variant": "none",
      "hook_source": "opencode",
      "transport": "inline-json",
      "command": ["opencode", "--agent", "fleet-reviewer"],
      "healthcheck": ["opencode", "--version"],
      "ready_pattern": "ctrl\\+p commands|\\.opencode/agents/|[0-9]+\\.[0-9]+\\.[0-9]+[[:space:]]*$",
      "enabled": true,
      "requires_env": ["MINIMAX_API_KEY"],
      "capabilities": ["candidate_generation", "parallel_validation", "diverse_perspective"],
      "tool_access": ["filesystem_read", "fleet_control"],
      "authority": "advisory",
      "resource_class": "remote",
      "display_rank": 31,
      "concurrency": 1
    },
    "minimax_checker": {
      "phase": "BUILD",
      "runner": "interactive",
      "provider": "minimax",
      "model": "MiniMax-M3",
      "variant": "none",
      "hook_source": "opencode",
      "transport": "inline-json",
      "command": ["opencode", "--agent", "minimax-checker"],
      "healthcheck": ["opencode", "--version"],
      "ready_pattern": "ctrl\\+p commands|\\.opencode/agents/|[0-9]+\\.[0-9]+\\.[0-9]+[[:space:]]*$",
      "enabled": true,
      "requires_env": ["MINIMAX_API_KEY"],
      "capabilities": ["contract_checking", "parallel_validation", "diverse_perspective"],
      "tool_access": ["filesystem_read", "fleet_control"],
      "authority": "advisory",
      "resource_class": "remote",
      "display_rank": 31,
      "concurrency": 1
    },
    "reviewer": {
      "phase": "VERIFY",
      "runner": "local",
      "provider": "ollama",
      "model": "code-auditor:latest",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["supplied_diff_review", "security_review", "architecture_review", "regression_checklist"],
      "tool_access": ["prompt_only"],
      "authority": "verification",
      "resource_class": "local_heavy",
      "display_rank": 50,
      "concurrency": 1,
      "num_predict": 2048,
      "instructions": "You review supplied diffs and evidence for security, architecture, regressions, and missing tests."
    },
    "kimi": {
      "phase": "VERIFY",
      "runner": "interactive",
      "provider": "moonshot-ai",
      "model": "kimi-code/k3",
      "hook_source": "kimi",
      "transport": "inline-tokenized",
      "command": ["kimi", "--model", "kimi-code/k3", "--plan"],
      "healthcheck": ["kimi", "doctor"],
      "ready_pattern": "Welcome to Kimi|kimi-code|ctrl-x|context left|/help",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["independent_code_review", "long_context_review", "architecture_challenge"],
      "tool_access": ["filesystem_read", "fleet_control"],
      "authority": "verification",
      "resource_class": "remote",
      "display_rank": 50,
      "concurrency": 1
    },
    "claude_reviewer": {
      "phase": "VERIFY",
      "runner": "interactive",
      "provider": "anthropic",
      "model": "claude-fable-5",
      "hook_source": "claude",
      "transport": "pointer",
      "command": ["claude", "--model", "claude-fable-5", "--effort", "xhigh", "--permission-mode", "plan", "--no-chrome", "--append-system-prompt", "HARD OUTPUT CONTRACT - NON-NEGOTIABLE: when the prompt requests JSON, your entire visible reply is exactly one JSON object, then the fleet sentinel on its own final line. Nothing else, ever. The first visible character of your final answer must be {. FORBIDDEN before, between, or after the JSON and the sentinel: prose, preambles, tool-availability notes, conclusions, headings, bullet lists, tables, Markdown fences, or status narration. One stray visible word outside the JSON invalidates the run. All analysis stays internal; anything worth reporting goes inside the JSON fields the prompt defines."],
      "healthcheck": ["claude", "auth", "status"],
      "ready_pattern": "^[[:space:]]*❯[[:space:]]*$|new task\\?",
      "enabled": true,
      "requires_env": [],
      "capabilities": ["independent_code_review", "test_reproduction", "architecture_challenge"],
      "tool_access": ["filesystem_read", "shell_read", "git_read", "fleet_control"],
      "authority": "verification",
      "resource_class": "remote",
      "display_rank": 50,
      "concurrency": 1
    }
  },
  "presets": {
    "dan": {
      "description": "Dan+ autonomous visible team: one lead dynamically delegates to heterogeneous specialists and owns synthesis.",
      "mode": "autonomous",
      "include_lead": true,
      "identity_groups": [["builder", "challenger", "verifier"]],
      "instances": [
        {"instance_id": "scout", "role_type": "codex_candidate", "display_rank": 20, "authority": "advisory", "phase": "RECON", "tool_access": ["filesystem_read", "shell_read", "git_read", "fleet_control"]},
        {"instance_id": "builder", "role_type": "codex"},
        {"instance_id": "challenger", "role_type": "glm"},
        {"instance_id": "verifier", "role_type": "claude_reviewer"}
      ]
    },
    "small": {
      "description": "One frontier lead for a bounded sequential task.",
      "include_lead": true,
      "instances": []
    },
    "audit": {
      "description": "Identity-diverse frontier perspectives followed by a supplied-diff reviewer.",
      "include_lead": true,
      "identity_groups": [["analysis", "challenge", "verify"]],
      "instances": [
        {"instance_id": "analysis", "role_type": "codex", "authority": "advisory", "phase": "RECON", "tool_access": ["filesystem_read", "shell_read", "git_read", "fleet_control"]},
        {"instance_id": "challenge", "role_type": "minimax"},
        {"instance_id": "verify", "role_type": "reviewer"}
      ]
    },
    "implementation_review": {
      "description": "One tool-capable writer and one identity-distinct supplied-diff reviewer.",
      "include_lead": true,
      "identity_groups": [["build", "verify"]],
      "instances": [
        {"instance_id": "build", "role_type": "codex"},
        {"instance_id": "verify", "role_type": "reviewer"}
      ]
    },
    "frontier_verification": {
      "description": "One writer, one identity-diverse read-only challenger, and one frontier verifier.",
      "include_lead": true,
      "identity_groups": [["build", "challenge", "verify"]],
      "instances": [
        {"instance_id": "build", "role_type": "codex"},
        {"instance_id": "challenge", "role_type": "glm"},
        {"instance_id": "verify", "role_type": "claude_reviewer"}
      ]
    },
    "kimi_review": {
      "description": "One Codex writer followed by an independent read-only Kimi K3 verifier.",
      "include_lead": true,
      "identity_groups": [["build", "verify"]],
      "instances": [
        {"instance_id": "build", "role_type": "codex"},
        {"instance_id": "verify", "role_type": "kimi"}
      ]
    },
    "kimi_audit": {
      "description": "Autonomous read-only Kimi K3 audit lane with a CONTROL lead.",
      "mode": "autonomous",
      "include_lead": true,
      "instances": [
        {"instance_id": "verify", "role_type": "kimi"}
      ]
    },
    "fleet_dialogue": {
      "description": "Bounded CONTROL-stepped Maker/Checker dialogue followed by identity-diverse challenge and verification.",
      "mode": "assured",
      "include_lead": true,
      "identity_groups": [["maker", "checker", "challenge", "verify"]],
      "instances": [
        {"instance_id": "maker", "role_type": "codex"},
        {"instance_id": "checker", "role_type": "minimax_checker"},
        {"instance_id": "challenge", "role_type": "glm"},
        {"instance_id": "verify", "role_type": "claude_reviewer"}
      ]
    },
    "hotfix_validated": {
      "description": "Identity-diverse candidates whose first result must still pass deterministic verification gates.",
      "include_lead": true,
      "identity_groups": [["candidate_codex", "candidate_minimax", "verify"]],
      "instances": [
        {"instance_id": "candidate_codex", "role_type": "codex_candidate"},
        {"instance_id": "candidate_minimax", "role_type": "minimax_candidate"},
        {"instance_id": "verify", "role_type": "reviewer"}
      ]
    },
    "research": {
      "description": "Two uniquely addressed local triage instances plus heterogeneous frontier synthesis.",
      "mode": "autonomous",
      "include_lead": true,
      "identity_groups": [["research", "challenge"]],
      "instances": [
        {"instance_id": "triage_scope", "role_type": "triage"},
        {"instance_id": "triage_sources", "role_type": "triage"},
        {"instance_id": "research", "role_type": "codex", "authority": "advisory", "phase": "RECON", "tool_access": ["filesystem_read", "shell_read", "git_read", "fleet_control"]},
        {"instance_id": "challenge", "role_type": "glm"}
      ]
    }
  }
}
