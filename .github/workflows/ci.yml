name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare diagnostics directory
        run: mkdir -p ci-artifacts

      - name: Run portable CI contract
        shell: bash
        run: |
          set +e
          ./scripts/check-ci.sh 2>&1 | tee ci-artifacts/check-ci.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14
